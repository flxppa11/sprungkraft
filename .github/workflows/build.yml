name: iPhone-App bauen

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Werkzeuge installieren
        run: brew install xcodegen ldid

      - name: Xcode-Projekt erzeugen
        run: xcodegen generate

      - name: App bauen (ohne Signatur)
        run: >
          xcodebuild
          -project Sprungkraft.xcodeproj
          -scheme Sprungkraft
          -configuration Release
          -sdk iphoneos
          -destination 'generic/platform=iOS'
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY=""

      - name: IPA-Datei erzeugen
        run: |
          APP=build/Build/Products/Release-iphoneos/Sprungkraft.app
          ldid -SApp/App.entitlements "$APP/Sprungkraft" || true
          ldid -SWidget/Widget.entitlements "$APP/PlugIns/SprungWidget.appex/SprungWidget" || true
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry Sprungkraft.ipa Payload

      - name: IPA zum Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Sprungkraft-IPA
          path: Sprungkraft.ipa
